name: Publish Oslo Scanner Dashboards
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Oslo Buffett Value Scan", "Oslo Golden Cross Scan"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'value/index.html'
      - 'value/data.json'
      - '.github/workflows/value-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: oslo-scanner-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - uses: actions/checkout@v4
        with:
          ref: dashboard
          path: golden
      - name: Prepare combined website
        run: |
          mkdir -p _site/value
          cp golden/index.html _site/index.html
          cp golden/oslo_universe.csv _site/oslo_universe.csv
          cp golden/errors.csv _site/errors.csv
          cp source/value/index.html _site/value/index.html
          cp source/value/data.json _site/value/data.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
